{{ define "body" }}
<h1>Odin's QR Generator</h1>
<p class="subtitle">Generate QR codes from text</p>
{{ if .Error }}
<div class="error">{{ .Error }}</div>
{{ end }}
{{ if .ImageURL }}
<a href="{{ .ImageURL }}" download="qrcode">
  <img src="{{ .ImageURL }}" alt="QR Code" />
</a>
{{ end }}
<form action="/generate" method="post">
  <label for="string">Text string:</label>
  <input type="text" name="string" id="string" />
  <button type="submit">Send</button>
</form>
<p class="note">Generated QR images are automatically deleted after 5 minutes.</p>
{{ end }}
